services:

  db:
    image: postgres:17
    container_name: vitanova-db

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data


  web:
    build: .

    container_name: vitanova-backend

    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432

    command: gunicorn vitanovaBack.wsgi:application --bind 0.0.0.0:8000

    ports:
      - "8000:8000"

    depends_on:
      - db


volumes:
  postgres_data: