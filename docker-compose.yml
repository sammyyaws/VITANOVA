version: "3.9"

services:

  db:
    image: postgres:17
    container_name: vitanova-db

    environment:
      POSTGRES_DB: vitanova
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .

    container_name: vitanova-backend

    command: gunicorn vitanovaBack.wsgi:application --bind 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      - db

volumes:
  postgres_data: